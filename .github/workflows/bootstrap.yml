name: Bootstrap source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/1/comments?per_page=100" --jq 'sort_by(.id) | .[].body' | tr -d '\r\n ' > /tmp/payload.b64
          test "$(wc -c < /tmp/payload.b64)" -eq 294312
          echo "4a276298d0dc9d9cee8d2303332ce774771918d5eb1d4d9bbcba5da7337a2643  /tmp/payload.b64" | sha256sum -c -
          base64 -d /tmp/payload.b64 > /tmp/project.tar.xz
          echo "739942e4c63aae22bd5f72337dd57a84ddce4dc4a3ce7554848ba15b8aa144e1  /tmp/project.tar.xz" | sha256sum -c -
          tar -xJf /tmp/project.tar.xz -C .
          rm -f .github/workflows/bootstrap.yml\n          rm -f .github/workflows/ci.yml

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Portal Vicosa source"
          git push origin main
